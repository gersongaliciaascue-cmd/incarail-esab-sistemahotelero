<!DOCTYPE html>  
<html lang="es">  
<head>  
  <meta charset="UTF-8">  
  <title>INCA RAIL ESAB</title>  
  <style>  
    body {   
      margin: 0; padding-top: 50px;  
      font-family: Arial, sans-serif; color: #fff; text-align: center;  
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),   
                  url(https://images.unsplash.com/photo-1526772662000-3f88f10405%20-) center/cover fixed;  
      min-height: 100vh;  
    }  
    h1 { font-size: 48px; margin-bottom: 40px; }  
    button {  
      background: #000; color: #fff; border: 2px solid #fff; border-radius: 10px;  
      padding: 20px 40px; margin: 10px; font-size: 18px; font-weight: bold;  
      cursor: pointer; width: 300px;  
    }  
    #modalReportes {   
      display: none; position: fixed; top: 50px; left: 50%;  
      transform: translateX(-50%); width: 80%; max-width: 900px;  
      background: #222; padding: 20px; border-radius: 8px; border: 1px solid #fff;  
      text-align: left; z-index: 1000;  
    }  
  </style>  
</head>  
<body>  
  
  <h1>INCA RAIL ESAB</h1>  
  <button>VIVIENDA CALICANTO</button>  
  <button>VIVIENDA ANDENES</button>  
  <br>  
  <button onclick="abrirReportes()">REPORTES</button>  
  
  <div id="modalReportes">  
    <button onclick="cerrarReportes()" style="float:right; width:auto; padding:5px 10px;">X</button>  
    <div id="resumenCol"></div>  
    <div id="listaCamas"></div>  
  </div>  
  
<script>  
const CLAVE_REPORTES = 'incarail789'; // Tu clave  
  
function abrirReportes() {  
  const clave = prompt('Ingrese contraseña para ver Reportes:');  
  if (clave === CLAVE_REPORTES) {  
    document.getElementById('modalReportes').style.display = 'block';  
    mostrarReportes();  
  } else if (clave !== null) {   
    alert('Contraseña incorrecta');  
  }  
}  
  
function cerrarReportes() {  
  document.getElementById('modalReportes').style.display = 'none';  
}  
  
async function mostrarReportes() {  
  document.getElementById('listaCamas').innerHTML = '<p>Cargando...</p>';  
  try {  
    const res = await fetch('/api/camas-ocupadas');   
    if(!res.ok) throw new Error('Error ' + res.status);  
    const camas = await res.json();  
      
    if(camas.length === 0) {  
      document.getElementById('listaCamas').innerHTML = '<p>No hay camas ocupadas</p>';  
      return;  
    }  
  
    let html = `<p>Total: ${camas.length} camas ocupadas</p>`;  
    camas.forEach(c => {  
      html += `<div style="border-bottom:1px solid #444; padding:8px 0;">  
        <b>${c.vivienda}</b> - Hab ${c.habitacion} Cama ${c.cama_num}   
        - ${c.nombre || 'Sin nombre'} DNI: ${c.dni || '-'}  
        <button onclick="liberarCama('${c.vivienda}', '${c.habitacion}', '${c.cama_num}')" style="margin-left:10px;">Liberar</button>  
      </div>`;  
    });  
    document.getElementById('listaCamas').innerHTML = html;  
  
  } catch(e) {  
    document.getElementById('listaCamas').innerHTML = '<p style="color:red;">Error: ' + e.message + '</p>';  
  }  
}  
  
async function liberarCama(vivienda, habitacion, cama_num) {  
  if(!confirm('¿Liberar esta cama?')) return;  
  const res = await fetch('/api/liberar-cama', {   
    method: 'POST',  
    headers: {'Content-Type': 'application/json'},  
    body: JSON.stringify({vivienda, habitacion, cama_num})  
  });  
  const data = await res.json();  
  alert(data.mensaje || data.error);  
  if(res.ok) mostrarReportes(); // Recarga  
}  
</script>  
</body>  
</html>
